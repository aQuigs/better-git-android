// Shared script: sync-common keeps every repo's copy identical to the original in the tooling checkout; edit the original only.

// Groovy because a Kotlin script applied with apply(from=) cannot see the android extension.

android {
    defaultConfig {
        // Only Play needs rising codes; a fixed code elsewhere lets any worktree's build install over another's.
        // Squash merges raise the commit count on every merge to main; a shallow clone gives 1.
        // Set here because AGP ignores -Pandroid.injected.version.code.
        versionCode = providers.gradleProperty('android.injected.signing.store.file').present
            ? providers.exec { commandLine('git', 'rev-list', '--count', 'HEAD') }
                .standardOutput.asText.get().trim().toInteger()
            : 1
    }

    buildTypes {
        // Debug-signed so it installs over the debug build and keeps the app's data; play_internal.yaml injects the upload key
        release {
            minifyEnabled = true
            signingConfig = signingConfigs.debug
        }
    }
}

// isFile rather than canExecute, because the configuration cache only notices isFile changing
def syncCommon = System.getenv('PATH')?.tokenize(File.pathSeparator)
    ?.collect { new File(it, 'sync-common') }
    ?.find { it.isFile() && it.canExecute() }
def syncShared = tasks.register('syncShared', Exec) {
    enabled = syncCommon != null
    workingDir = rootDir
    commandLine(syncCommon?.path ?: 'sync-common')
}
tasks.named('preBuild') { dependsOn(syncShared) }
